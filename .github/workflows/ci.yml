name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          # 架构边界测试会跨仓校验七端 SDK 的事件分发实现，需要它在场
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # protoc：契约由 .proto 在构建期生成。
      # GTK/glib：bindings/tauri 会把 tauri 拉进 --all-targets 的编译范围，
      # 而 tauri 在 Linux 上依赖 glib-sys 等系统库；缺了会以
      # 「The system library `glib-2.0` ... was not found」中断 clippy 步骤。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev


      # 格式先查：最快，失败得早，省掉后面的编译时间
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --features storage-sqlite -- -D warnings

      # e2ee 是可选 feature：默认关闭时那条路径不参与编译，
      # 不单独跑一遍的话，密码学实现坏了 CI 也不会知道。
      - name: clippy（e2ee feature）
        run: cargo clippy --features e2ee --all-targets --no-deps -- -D warnings

      - name: test（e2ee feature）
        run: cargo test --features e2ee --lib

      - name: test
        run: cargo test --features storage-sqlite

  # 供应链审计与主流程解耦：advisory DB 每天在变，
  # 不该因为上游新披露的 CVE 就让无关的功能 PR 变红。
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          # 架构边界测试会跨仓校验七端 SDK 的事件分发实现，需要它在场
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # protoc：契约由 .proto 在构建期生成。
      # GTK/glib：bindings/tauri 会把 tauri 拉进 --all-targets 的编译范围，
      # 而 tauri 在 Linux 上依赖 glib-sys 等系统库；缺了会以
      # 「The system library `glib-2.0` ... was not found」中断 clippy 步骤。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev


      - name: 安装 cargo-audit / cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit（已知漏洞）
        run: cargo audit

      - name: cargo deny（许可 / 来源 / 重复依赖）
        run: cargo deny check

  # 包体预算：WASM 产物有没有悄悄变胖。
  #
  # 体积是用户直接付钱的性能指标（首屏要下多少字节、浏览器要编译多少字节），
  # 但它**没有任何运行时信号**——加一个胖依赖、开一个本该关掉的 feature，
  # 测试全绿、CI 全绿，只有真实用户的首屏变慢。
  # release profile 里的 `wasm-opt -Oz` 拦不住「优化开着、输入却涨了一倍」。
  #
  # 与耗时门禁的关键区别:体积是确定的,没有 runner 噪声,所以阈值可以设紧
  # （余量 +10%）,不必像 flare-core 的性能门禁那样留 50~100 倍。
  wasm-size:
    name: WASM 包体预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用本仓 package.json 里已经钉住的 wasm-pack（package-lock 锁着版本），
      # 不引第三方 action:一来少一个供应链来源,二来 CI 与本地跑的是同一个版本,
      # 免得「本地 4.5MB / CI 4.9MB」这种由工具链差异造成的假回归。
      - name: 安装 wasm-pack（走本仓锁定版本）
        working-directory: bindings/wasm
        run: npm ci

      # 必须真构建再量：产物不入库，量仓里的文件等于量了个寂寞。
      # 脚本在产物缺失时判红而不是跳过——「没量到」和「量了没超」必须是两种结果。
      - name: 构建 WASM
        working-directory: bindings/wasm
        run: npm run build

      - name: 判包体预算
        working-directory: bindings/wasm
        run: python3 scripts/check_wasm_budget.py

  # 许可证口径：README 是 crates.io 页面渲染的内容，它写的许可证与 Cargo.toml
  # 声明的不一致是法务问题，不是排版问题——而且没有任何测试会碰到它。
  #
  # 已经真的发生过（2026-08-20 全仓核查）：flare-grpc-proto 的中英文 README 都写着
  # 「MIT（见 Cargo.toml）」，而 Cargo.toml 写的是 Apache-2.0，自己打自己的脸；
  # flare-proto 的中文 README 写 MIT、英文写 Apache-2.0，同仓中英文互相矛盾。
  # flare-core 早前修过同类问题，但当时只修了自己那一个仓，没往外扫。
  #
  # 另一条：声明了 license 却没把 LICENSE 正文打进包里，等于发了一个不满足
  # 自己所声明许可证（Apache-2.0 §4(a) 要求随件附带许可证副本）的包。
  readme-claims:
    name: 门面文档口径
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: README 许可证声明与 Cargo.toml 一致
        shell: bash
        run: |
          declared=$(grep -m1 '^license' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ -n "$declared" ] || { echo "✗ Cargo.toml 没有 license 字段"; exit 1; }
          key=$(echo "${declared%%-*}" | tr 'A-Z' 'a-z')
          fail=0
          for f in README.md README.zh-CN.md; do
            [ -f "$f" ] || continue
            # 只看 License / 许可 小节：正文里提到别的协议（依赖清单之类）不该误判
            section=$(awk '/^#+ *(License|许可)/{f=1;next} /^#+ /{f=0} f' "$f")
            [ -n "$section" ] || { echo "✗ $f 找不到 License / 许可 小节"; fail=1; continue; }
            echo "$section" | grep -qi "$key" \
              || { echo "✗ $f 许可证小节没提 $declared"; fail=1; }
            for other in MIT GPL BSD MPL ISC; do
              o=$(echo "$other" | tr 'A-Z' 'a-z'); [ "$o" = "$key" ] && continue
              echo "$section" | grep -qiE "\b$other\b" \
                && { echo "✗ $f 许可证小节写着 $other，而 Cargo.toml 声明 $declared"; fail=1; }
            done
          done
          [ $fail -eq 0 ] && echo "  ✓ README 许可证声明与 Cargo.toml（$declared）一致"
          exit $fail

      # 这里只查文件在不在——「真的进了包」是更强的判据，由 publishable job 里的
      # cargo package --list 负责（那个 job 才有同级仓与 protoc 这些前置条件）。
      - name: crate 目录里有 LICENSE 正文
        shell: bash
        run: |
          ls LICENSE* >/dev/null 2>&1 \
            || { echo "✗ 没有 LICENSE 文件。声明了许可证却不随件附带正文，发出去的包不满足它自己声明的协议。"; exit 1; }
          echo "  ✓ $(ls LICENSE*) 在 crate 目录里"

      # README 里的版本号：编译判据对它是瞎的（cargo 的 ^ 语义会把旧 pin 解析到
      # 新版本，新旧都编得过），但那个数字是给人读、给人照抄的。
      # 已发生过：flare-proto 写 2.0.1（实际 2.1.0）、flare-core 写 1.0.1（实际 1.1.1）。
      #
      # 「一个 pin 都没有」同样判红：已发布的 crate，它的 crates.io 页面上总得写清楚
      # 怎么装。flare-im-core-sdk 与 flare-plugin-host 此前就是一行安装说明都没有。
      - name: README 里的版本号还是当前发布版
        shell: bash
        run: |
          name=$(grep -m1 '^name' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          latest=$(curl -sf --max-time 25 -H "User-Agent: flare-readme-gate" \
            "https://crates.io/api/v1/crates/$name" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["crate"]["max_version"])' 2>/dev/null) || latest=""
          # registry 抖动不该阻断一个无关的 PR：查不到就跳过并说明，不静默通过。
          if [ -z "$latest" ]; then echo "  · 跳过版本新鲜度（查不到 registry）"; exit 0; fi
          fail=0
          for f in README.md README.zh-CN.md; do
            [ -f "$f" ] || continue
            # 两种写法都要认，只认字符串式会在依赖块改成表式那天悄悄失效：
            #   flare-x = "1.2"                              ← 字符串式
            #   flare-x = { version = "1.2", features = [] }  ← 表式
            # 这不是假设：flare-im-core-sdk 的安装块为了标注 feature 就是表式的，
            # 第一版正则当场把 pins 读成空，于是「一个 pin 都没有」那条误判成红。
            # 取依赖那一行里第一个以数字开头的带引号串，两种写法都覆盖得到。
            pins=$(grep -E "^[[:space:]]*$name[[:space:]]*=" "$f" \
                     | grep -oE '"[0-9][^"]*"' | tr -d '"' | sort -u)
            if [ -z "$pins" ]; then
              echo "✗ $f 里没有任何 $name 的依赖示例"
              echo "  这是个已发布的 crate，README 就是它的 crates.io 页面——上面得写清楚怎么装。"
              fail=1; continue
            fi
            for p in $pins; do
              case "$latest" in "$p"|"$p".*) ;; *) echo "✗ $f 写着 $name $p，当前发布版是 $latest"; fail=1;; esac
            done
          done
          [ $fail -eq 0 ] && echo "  ✓ README 里的 $name 版本号与 registry（$latest）一致"
          exit $fail

  # README 是 crates.io 页面渲染的内容。官网文档站在私有仓、没有部署路径，
  # 所以外部使用者实际拿得到的文档就是它——它坏了没有任何别的信号
  # （cargo test / clippy 都不碰 README）。
  #
  # 刻意**不**拉同级仓库：这道门禁验的就是「外部读者只有 registry」这个前提。
  # 同级目录一摆上，path 依赖会顶上去，样例永远编得过，门禁就废了。
  #
  # 本仓用脚本按 registry 编，而不是 flare-proto / flare-grpc-proto 那种
  # `#[cfg(doctest)] #[doc = include_str!]`：那条路按本地源码编，而这里的样例需要
  # lifecycle-sqlite 与 tokio，跟 cargo test 的默认 feature 对不上；按 registry 编
  # 还多验一件事——已经发出去的那个版本是不是真的能这么用。
  readme:
    name: README 样例能否编过
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 样例依赖链上的 flare-grpc-proto 的 build.rs 要 protoc。第一次接这道门禁时
      # 忘了装，CI 报的是「样例编不过」——那是环境缺前置，不是样例真的坏，
      # 判据形同虚设。脚本现在会把这两种情况分开报，但环境该装还是要装。
      - name: 安装 protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

      - name: 校验 README 样例与版本号
        run: python3 scripts/check_readme_sample.py

  # 性能基线：benches/perf_baseline.rs 一直存在，但**在此之前没有任何 CI 跑过它**。
  # 基线建了没人看就是慢慢腐坏——编不过、跑 panic、某个 case 被悄悄删掉，
  # 都不会有任何信号。
  #
  # 它测的全是本地路径（内存 store、事件总线、编解码），不需要后端，所以能进 CI。
  # MX-PERF-01 里「sync 千条」这一项就落在
  # sync_messages/event_bus_publish_and_drain_1000 上。
  #
  # 判据刻意不按绝对耗时设紧阈值:共享 runner 上同一段代码能差好几倍
  # （flare-core 那道门禁实测 CI 比本机慢 2~3.2 倍）。实际判的是齐全性 +
  # 规模比值（复杂度，不是速度）+ 留 50 倍以上余量的天花板，细节见脚本头部。
  perf:
    name: 性能基线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

      # `shell: bash` 不能省：默认 shell 只带 -e 不带 pipefail，管道给了 tee
      # 之后退出码取的是 tee 的——门禁判红会被吞成绿。
      - name: 跑基线并判回归
        shell: bash
        run: python3 scripts/check_perf_baseline.py | tee perf-baseline.txt

      # 数字要能被外部复现和引用——「公开性能基准」这半件事靠这个产物落地。
      - name: 上传本轮数字
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-sdk
          path: perf-baseline.txt

  # 架构与契约门禁：xtask/src/verify 下 13 道判据（约 130KB），
  # 在 2026-08-20 之前**CI 里一条 xtask 命令都没有**——只在有人手动敲
  # `cargo xtask verify` 时才跑。跑一次就知道后果：4 道红的，而且 verify 顺序执行、
  # 遇错即停，第一道红之后的 14 步从来没被执行过。四道全部修好了（三道是判据
  # 自己过时，一道是判据自相矛盾），这个 job 就是为了不再让它们烂掉。
  #
  # **不用 `cargo xtask verify` 总入口**：它里面有三步需要私有仓 flare-sdk-plugin
  # （plugin-marketplace / rtc-capability / plugin-verify），公开仓的 CI 拿不到。
  # 所以逐条列出能跑的 11 道，并把跑不了的 3 道**明写在日志里**——
  # 「少验了什么」必须看得见，不能靠沉默。
  xtask-verify:
    name: 架构与契约门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          # 判据要读客户端 SDK 的 packages / sdk-spec / examples；xtask 解析根目录时
          # 找不到它会直接 bail，不是跳过。
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
          # e2ee / 多端状态两道要读服务端源码（推送可见性、扇出实现）。
          clone https://github.com/flare-im/flare-im-core-server.git "../flare-im-core"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 protoc
        run: sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler

      - name: 跑门禁
        shell: bash
        run: |
          set -euo pipefail
          GATES="spec core-contract multidevice-state network-reconnect observability
                 performance e2ee-contract enterprise-compliance channel-capability
                 media-processing structure"
          EXPECTED=11
          echo "跳过 3 道（需要私有仓 flare-sdk-plugin，公开 CI 拿不到）："
          echo "  · plugin-marketplace   · rtc-capability   · plugin-verify"
          echo ""
          ran=0
          for g in $GATES; do
            echo "--- cargo xtask $g"
            cargo xtask "$g"
            ran=$((ran + 1))
          done
          # 数量对不上就判红：清单被人删短了而没改这个数字，等于门禁悄悄缩水。
          if [ "$ran" -ne "$EXPECTED" ]; then
            echo "✗ 只跑了 $ran 道，期望 $EXPECTED 道——清单被改短了？"
            exit 1
          fi
          echo ""
          echo "  ✓ $ran 道架构与契约门禁全部通过"
