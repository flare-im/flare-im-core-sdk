name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          # 架构边界测试会跨仓校验七端 SDK 的事件分发实现，需要它在场
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # protoc：契约由 .proto 在构建期生成。
      # GTK/glib：bindings/tauri 会把 tauri 拉进 --all-targets 的编译范围，
      # 而 tauri 在 Linux 上依赖 glib-sys 等系统库；缺了会以
      # 「The system library `glib-2.0` ... was not found」中断 clippy 步骤。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev


      # 格式先查：最快，失败得早，省掉后面的编译时间
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --features storage-sqlite -- -D warnings

      # e2ee 是可选 feature：默认关闭时那条路径不参与编译，
      # 不单独跑一遍的话，密码学实现坏了 CI 也不会知道。
      - name: clippy（e2ee feature）
        run: cargo clippy --features e2ee --all-targets --no-deps -- -D warnings

      - name: test（e2ee feature）
        run: cargo test --features e2ee --lib

      - name: test
        run: cargo test --features storage-sqlite

  # 供应链审计与主流程解耦：advisory DB 每天在变，
  # 不该因为上游新披露的 CVE 就让无关的功能 PR 变红。
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # 本项目是多仓库结构，各仓的 path 依赖指向同级仓库目录。
      # 单仓 checkout 后这些路径不存在，cargo 会直接解析失败，
      # 所以这里按开发时的布局把依赖仓拉到同级位置。
      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"
          # 架构边界测试会跨仓校验七端 SDK 的事件分发实现，需要它在场
          clone https://github.com/flare-im/flare-im-core-client-sdk.git "../flare-im-core-client-sdk"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # protoc：契约由 .proto 在构建期生成。
      # GTK/glib：bindings/tauri 会把 tauri 拉进 --all-targets 的编译范围，
      # 而 tauri 在 Linux 上依赖 glib-sys 等系统库；缺了会以
      # 「The system library `glib-2.0` ... was not found」中断 clippy 步骤。
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler pkg-config \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev


      - name: 安装 cargo-audit / cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit（已知漏洞）
        run: cargo audit

      - name: cargo deny（许可 / 来源 / 重复依赖）
        run: cargo deny check

  # 包体预算：WASM 产物有没有悄悄变胖。
  #
  # 体积是用户直接付钱的性能指标（首屏要下多少字节、浏览器要编译多少字节），
  # 但它**没有任何运行时信号**——加一个胖依赖、开一个本该关掉的 feature，
  # 测试全绿、CI 全绿，只有真实用户的首屏变慢。
  # release profile 里的 `wasm-opt -Oz` 拦不住「优化开着、输入却涨了一倍」。
  #
  # 与耗时门禁的关键区别:体积是确定的,没有 runner 噪声,所以阈值可以设紧
  # （余量 +10%）,不必像 flare-core 的性能门禁那样留 50~100 倍。
  wasm-size:
    name: WASM 包体预算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉取同级仓库
        run: |
          BR="${GITHUB_REF_NAME:-main}"
          clone() {
            git clone --depth 1 -b "$BR" "$1" "$2" 2>/dev/null \
              || git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/flare-im/flare-core.git "../flare-core"
          clone https://github.com/flare-im/flare-proto.git "../flare-proto"
          clone https://github.com/flare-im/flare-grpc-proto.git "../flare-grpc-proto"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 用本仓 package.json 里已经钉住的 wasm-pack（package-lock 锁着版本），
      # 不引第三方 action:一来少一个供应链来源,二来 CI 与本地跑的是同一个版本,
      # 免得「本地 4.5MB / CI 4.9MB」这种由工具链差异造成的假回归。
      - name: 安装 wasm-pack（走本仓锁定版本）
        working-directory: bindings/wasm
        run: npm ci

      # 必须真构建再量：产物不入库，量仓里的文件等于量了个寂寞。
      # 脚本在产物缺失时判红而不是跳过——「没量到」和「量了没超」必须是两种结果。
      - name: 构建 WASM
        working-directory: bindings/wasm
        run: npm run build

      - name: 判包体预算
        working-directory: bindings/wasm
        run: python3 scripts/check_wasm_budget.py
