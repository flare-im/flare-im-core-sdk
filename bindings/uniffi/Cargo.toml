[package]
name = "flare-im-core-sdk-uniffi"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Core SDK - UniFFI Bindings (Kotlin/Swift/Python)"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flare-im-core-sdk = { path = "../.." }
flare-im-core-sdk-storage-sqlite = { path = "../../storage/sqlite" }
flare-proto = { path = "../../../flare-proto" }
uniffi = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
prost = "0.14"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
