[package]
name = "flare-im-core-sdk-uniffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Core SDK - UniFFI bindings for Kotlin/Swift/Python"

[lib]
name = "flare_im_core_sdk_uniffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flare-im-core-sdk = { path = "../../", features = [] }
uniffi = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
uniffi_build = { workspace = true }
