[package]
name = "flare-im-core-sdk-uniffi"
version = "1.0.3"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Core SDK - UniFFI Bindings (Kotlin/Swift/Python)"
publish = false

# Archived placeholder. Keep this crate outside the main SDK workspace until a
# deliberate UniFFI redesign is approved.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flare-im-core-sdk-bindings-runtime = { version = "1.0.3", path = "../shared" }
flare-im-core-sdk = { version = "1.0.3", path = "../.." }
flare-im-core-sdk-storage-sqlite = { version = "1.0.3", path = "../../storage/sqlite" }
flare-proto = { version = "1.0.3", path = "../../../flare-proto" }
uniffi = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
prost = "0.14"
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
