[package]
name = "flare-im-core-sdk-bindings-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Contract-driven shared binding runtime for Flare IM Core SDK"

[lib]
name = "flare_im_core_sdk_bindings_runtime"
path = "src/lib.rs"

[dependencies]
flare-im-core-sdk = { path = "../.." }
flare-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
plugin-call = ["flare-im-core-sdk/plugin-call"]
