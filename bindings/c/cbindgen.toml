language = "C"
header = """
/*
 * Flare IM Core SDK - C ABI Header
 * 
 * This file is automatically generated by cbindgen.
 * DO NOT EDIT THIS FILE MANUALLY.
 * 
 * Generated from Rust source code.
 */
"""
include_guard = "FLARE_IM_CORE_SDK_FFI_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
pragma_once = true
include_version = true
usize_is_size_t = true

[export]
exclude = ["FlareIMSDKHandle"]
include = ["flare_im_sdk_*", "flare_im_string_free"]

[parse]
parse_deps = true
include = ["flare-im-core-sdk-ffi"]

[parse.expand]
all_features = false
default_features = true
