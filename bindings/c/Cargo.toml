[package]
name = "flare-im-core-sdk-ffi"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Core SDK - C FFI Bindings"

[lib]
name = "flare_im_core_sdk_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flare-im-core-sdk-bindings-runtime = { version = "0.1.0", path = "../shared" }
flare-im-core-sdk = { version = "0.2.0", path = "../..", features = ["lifecycle-sqlite"] }
flare-proto = { version = "1.0.3", path = "../../../flare-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
prost = "0.14"
dashmap = "5.5"
lazy_static = "1.4"
tracing = "0.1"

[features]
default = []
quic = ["flare-im-core-sdk/quic"]
dev-test-token = [
    "flare-im-core-sdk/dev-test-token",
    "flare-im-core-sdk-bindings-runtime/dev-test-token",
]

[build-dependencies]
cbindgen = "0.29"
