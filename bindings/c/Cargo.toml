[package]
name = "flare-im-core-sdk-ffi"
version = "1.0.3"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Core SDK - C FFI Bindings"

[lib]
name = "flare_im_core_sdk_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flare-im-core-sdk-bindings-runtime = { version = "1.0.3", path = "../shared" }
flare-im-core-sdk = { version = "1.0.3", path = "../..", features = ["lifecycle-sqlite"] }
flare-proto = { version = "2.0.0", path = "../../../flare-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
prost = "0.14"
dashmap = "5.5"
lazy_static = "1.4"
tracing = "0.1"

[features]
default = []
quic = ["flare-im-core-sdk/quic"]
dev-test-token = [
    "flare-im-core-sdk/dev-test-token",
    "flare-im-core-sdk-bindings-runtime/dev-test-token",
]

[build-dependencies]
# 精确钉版：cbindgen 会把自己的版本号写进生成的头文件
# （`/* Generated with cbindgen:0.29.4 */`），而本仓的 Cargo.lock 不入库，
# 用 caret 的话每台机器解析到的补丁版都可能不同，生成的头文件就跟着变——
# 于是 bridge 那道漂移检查会无缘无故翻红。工具版本泄漏进产物时，必须钉死。
cbindgen = "=0.29.4"
