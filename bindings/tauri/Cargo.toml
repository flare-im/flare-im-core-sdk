[package]
name = "flare-im-core-sdk-tauri"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Core SDK - Tauri Plugin"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
flare-im-core-sdk-bindings-runtime = { version = "0.1.0", path = "../shared" }
flare-im-core-sdk = { version = "0.2.0", path = "../..", features = ["lifecycle-sqlite"] }
flare-proto = { version = "1.0.2", path = "../../../flare-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.1", features = ["macos-private-api"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
quic = ["flare-im-core-sdk/quic"]
dev-test-token = [
    "flare-im-core-sdk/dev-test-token",
    "flare-im-core-sdk-bindings-runtime/dev-test-token",
]
