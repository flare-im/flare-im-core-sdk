[package]
name = "tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# protocol-asset：注册 asset 协议，前端 convertFileSrc 才能加载本地文件
tauri = { version = "2.10.1", features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2.4" }
tauri-plugin-opener = { version = "2.5" }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
flare-im-core-sdk-tauri = { path = "../../../bindings/tauri" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
