[package]
name = "flare-im-core-sdk-storage-sqlite"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Core SDK - SQLite 连接与运行时（pool + schema 注册"

[dependencies]
anyhow = "1.0"
log = "0.4"
once_cell = "1.19"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }
