[package]
name = "flare-im-core-sdk-storage-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Core SDK - SQLite Storage Implementation"

[dependencies]
# Core SDK (依赖 trait 定义)
flare-im-core-sdk = { path = "../..", default-features = false }

# 数据库
sqlx = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 异步
async-trait = { workspace = true }
tokio = { workspace = true }

# 工具
chrono = { workspace = true }
uuid = { workspace = true }

# 日志
tracing = { workspace = true }
