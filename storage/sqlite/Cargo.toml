[package]
name = "flare-im-core-sdk-storage-sqlite"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Core SDK - SQLite Storage Implementation"

[dependencies]
flare-im-core-sdk = { path = "../..", default-features = false }
flare-proto = { path = "../../../flare-proto" }

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
prost = "0.14"
tracing = "0.1"
