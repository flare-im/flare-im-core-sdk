language = "C"
header = """
/*
 * Flare IM Core SDK - C ABI Header
 * 
 * This file is automatically generated by cbindgen.
 * DO NOT EDIT THIS FILE MANUALLY.
 * 
 * Generated from Rust source code.
 */
"""
include_guard = "FLARE_IM_CORE_SDK_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
pragma_once = true
include_version = true
usize_is_size_t = true

[export]
exclude = ["FlareIMClientHandle"]
include = ["flare_im_client_*", "flare_im_string_free"]

[parse]
parse_deps = false  # 禁用依赖解析，只解析当前 crate
include = ["flare-im-core-sdk"]

[parse.expand]
all_features = false
default_features = true
features = ["ffi"]

# 排除某些文件，避免解析错误
[parse.exclude]
paths = [
    "src/ffi/safe.rs",  # 安全包装层不需要生成 C 绑定
]

