[package]
name = "xtask"
version = "1.0.3"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Unified Rust tooling for Flare IM Core SDK and Client SDK generation, build and verification"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
flare-im-core-sdk = "1.0.3"
flare-proto = { workspace = true }
regex = "1.10"
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
