[workspace]
resolver = "3"
members = [
    ".",
    "xtask",
    "storage/sqlite",
    "storage/indexeddb",
    "bindings/shared",
    "bindings/c",
    "bindings/wasm",
    "bindings/tauri",
]
exclude = [
    "bindings/uniffi",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"

[workspace.dependencies]
flare-proto = { version = "2.0.1", path = "../flare-proto" }
flare-grpc-proto = { version = "2.0.1", path = "../flare-grpc-proto" }
flare-core = { version = "1.1.0", path = "../flare-core", default-features = false }
tonic = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.1"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
once_cell = "1.19"
tauri = { version = "2", features = ["macos-private-api"] }
uniffi = "0.28"
uniffi_build = "0.28"
cbindgen = "0.26"

[package]
name = "flare-im-core-sdk"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "Apache-2.0"
description = "Flare IM Client SDK - Event-stream driven cross-platform IM client library"

[lib]
name = "flare_im_core_sdk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.release-mobile]
inherits = "release"
opt-level = "z"

[features]
# 默认仅启用 IM 基础能力；通话/RTC 通过 DATA capability 接入。
default = []
integration-tests = []
# Development-only helper for local gateway auth. Production builds must not
# expose token minting surfaces.
dev-test-token = []
# SQLite 持久化实现（Message/Conversation/PendingSend/UserProfile 仓储）
storage-sqlite = ["dep:sqlx"]
# 跨平台 SQLite 登录编排（依赖 storage/sqlite 连接池与 schema 注册）
lifecycle-sqlite = ["storage-sqlite", "dep:flare-im-core-sdk-storage-sqlite"]
# Native QUIC transport support. Browser/WASM remains WebSocket-only.
quic = ["flare-core/quic"]
# RichDoc v2 HTML 片段归一化；默认关闭以避免移动端无条件编译 HTML parser 重依赖。
rich-doc-html = ["dep:scraper", "dep:ego-tree"]
# 端到端加密的**参考实现**（XChaCha20-Poly1305 + X25519 + HKDF）。
# 不开时 E2EE 管线仍在，只是需要接入方自带 ContentCodec。
e2ee = ["dep:chacha20poly1305", "dep:x25519-dalek", "dep:hkdf"]
# 兼容任务/产品层命名：链接预览同样依赖 HTML 解析能力。
link-preview = ["rich-doc-html"]

[dependencies]
flare-core = { workspace = true, default-features = false, features = ["client", "websocket", "compression-gzip", "encryption-aes-gcm"] }
flare-proto = { workspace = true }
chrono = { workspace = true }

serde = { workspace = true }
serde_json = "1.0"
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = "2.0"
async-trait = "0.1"
arc-swap = "1.7"
prost = "0.14"
prost-types = { workspace = true }
tracing = "0.1"
flate2 = "1.0"
sha2 = "0.10"
# E2EE 参考实现用：AEAD + X25519 ECDH + HKDF。
# 放在可选 feature 后面 —— 不开 e2ee 的接入方不该为此背上密码学依赖。
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = { version = "2", optional = true, features = ["static_secrets"] }
hkdf = { version = "0.12", optional = true }
hmac = "0.12"
rand = "0.8"
hex = "0.4"
futures = "0.3"
uuid = { version = "1", features = ["v4", "js"] }

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
base64 = { version = "0.22" }
flare-im-core-sdk-storage-sqlite = { version = "1.1.0", path = "storage/sqlite", optional = true }
# RichDoc v2：Markdown 归一化 + 检索串规范化（全目标可用）
pulldown-cmark = "0.12"
unicode-normalization = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flare-grpc-proto = { workspace = true }
tonic = { workspace = true }
dirs = "5.0"
futures-util = "0.3"
bytes = "1"
url = "2.5"
scraper = { version = "0.20", optional = true }
ego-tree = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "WebSocket",
    "BinaryType",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Blob",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
once_cell = "1"
criterion = "0.5"

[[bench]]
name = "perf_baseline"
harness = false

[[example]]
name = "e2ee_demo"
required-features = ["lifecycle-sqlite", "e2ee"]

[[example]]
name = "two_clients_chat"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "two_user_latency_throughput"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "group_latency_throughput"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "e2e_event_observer"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "e2e_full_event_observer"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "e2e_full_event_ops"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "e2e_message_ops"
required-features = ["lifecycle-sqlite"]

[[example]]
name = "e2e_unread_regression"
required-features = ["lifecycle-sqlite"]
