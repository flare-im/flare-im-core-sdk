[workspace]
members = [
    ".",
    "bindings/c",
    "bindings/uniffi",
    "bindings/tauri",
    "examples/tauri/src-tauri",
    "storage/sqlite",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"

[workspace.dependencies]
# 共享依赖
flare-proto = { path = "../flare-proto" }
flare-core = { path = "../flare-core" }
flare-server-core = { path = "../flare-server-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
sha2 = "0.10"
hex = "0.4"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# SQLite 存储依赖
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
# Tauri 特定依赖
tauri = { version = "2", features = ["macos-private-api"] }
# UniFFI 特定依赖
uniffi = "0.28"
uniffi_build = "0.28"
# C ABI FFI 特定依赖
cbindgen = "0.26"

[package]
name = "flare-im-core-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Client SDK - Cross-platform IM client library"
repository = "https://github.com/flare-team/flare-im-core-sdk"

[lib]
name = "flare_im_core_sdk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
extensions = []
storage-tools = []
ffi = []  # C ABI 包装层（用于自动生成各平台绑定）
integration-tests = []  # 需服务端运行的接口/集成测试

[lints.rust]
# 允许 harmonyos 作为 target_os 值（HarmonyOS 平台支持）
# 允许 integration-tests feature（用于 interface_api_test 等）
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("harmonyos"))', 'cfg(feature, values("integration-tests"))'] }

[dependencies]
# 基础框架
flare-core = { workspace = true }
flare-proto = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = "1.0"

# 错误处理
anyhow = { workspace = true }
thiserror = "2.0"

# 工具
uuid = { version = "1.0" }
chrono = { version = "0.4", features = ["serde"] }
base64 = { version = "0.22", default-features = false, features = ["alloc", "std"] }
# 无锁数据结构
arc-swap = "1.7"
dashmap = "6.1"
lazy_static = "1.4"
once_cell = "1.20"
 

# 异步 trait 支持
async-trait = "0.1"

# 日志
tracing = "0.1"

# HTTP 客户端（用于媒体上传/下载和认证）
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }

# Protobuf
prost = "0.14"
prost-types = "0.14"

# Web 平台（IndexedDB 存储）
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["IdbDatabase", "IdbOpenDbRequest", "IdbTransaction", "IdbObjectStore", "IdbRequest", "IdbFactory", "IdbDatabase", "IdbTransactionMode", "IdbRequestReadyState", "DomException", "IdbKeyRange", "IdbVersionChangeEvent", "Window", "Document", "Location"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

# 非 wasm32 平台依赖
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
aes-gcm = { version = "0.10", features = ["aes"] }
tokio = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"

# 异步运行时与 HTTP（wasm）
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
getrandom_compat = { package = "getrandom", version = "0.2", features = ["js"] }
rand = "0.8"
base64 = "0.22"

# Android 平台（JNI 绑定）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tempfile = "3.10"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
once_cell = "1.20"
# SQLite 存储实现（用于测试）
flare-im-core-sdk-storage-sqlite = { path = "storage/sqlite" }

