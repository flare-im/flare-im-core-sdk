[workspace]
members = [
    ".",
    "storage/sqlite",
    "bindings/c",
    "bindings/tauri",
]
exclude = [
    "bindings/uniffi",
    "examples/tauri/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "MIT"

[workspace.dependencies]
flare-proto = { path = "../flare-proto" }
flare-grpc-proto = { path = "../flare-grpc-proto" }
flare-core = { path = "../flare-core" }
tonic = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
once_cell = "1.19"
tauri = { version = "2", features = ["macos-private-api"] }
uniffi = "0.28"
uniffi_build = "0.28"
cbindgen = "0.26"

[package]
name = "flare-im-core-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.94.0"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Client SDK - Event-stream driven cross-platform IM client library"

[lib]
name = "flare_im_core_sdk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# 默认仅启用 IM 基础能力；通话/RTC 通过可选插件接入。
default = []
integration-tests = []
# SQLite 持久化实现（Message/Conversation/PendingSend/UserProfile 仓储）
storage-sqlite = ["dep:sqlx"]
# 跨平台 SQLite 登录编排（依赖 storage/sqlite 连接池与 schema 注册）
lifecycle-sqlite = ["storage-sqlite", "dep:flare-im-core-sdk-storage-sqlite"]
# 通话信令 + `rtc.*` 能力插件（独立 crate `flare-sdk-plugin-call`）
plugin-call = ["dep:flare-sdk-plugin-call"]

[dependencies]
flare-core = { workspace = true }
flare-proto = { workspace = true }
flare-sdk-plugin-call = { path = "../flare-sdk-plugin/flare-sdk-plugin-call", optional = true }
chrono = { workspace = true }

serde = { workspace = true }
serde_json = "1.0"
anyhow = { workspace = true }
thiserror = "2.0"
async-trait = "0.1"
prost = "0.14"
prost-types = { workspace = true }
tracing = "0.1"
flate2 = "1.0"
jsonwebtoken = "9"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
futures = "0.3"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"], optional = true }
base64 = { version = "0.22" }
flare-im-core-sdk-storage-sqlite = { path = "storage/sqlite", optional = true }
# RichDoc v2：Markdown 归一化 + 检索串规范化（全目标可用）
pulldown-cmark = "0.12"
unicode-normalization = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
flare-grpc-proto = { workspace = true }
tonic = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dirs = "5.0"
futures-util = "0.3"
bytes = "1"
url = "2.5"
scraper = "0.20"
ego-tree = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt", "time"] }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
once_cell = "1"

[[example]]
name = "two_clients_chat"
required-features = ["lifecycle-sqlite"]
