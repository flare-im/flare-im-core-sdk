[workspace]
members = [
    ".",
    "storage/sqlite",
    "bindings/tauri",
]
exclude = [
    "bindings/c",
    "bindings/uniffi",
    "examples/tauri/src-tauri",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"

[workspace.dependencies]
flare-proto = { path = "../flare-proto" }
flare-core = { path = "../flare-core" }
flare-server-core = { path = "../flare-server-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
prost-types = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
tauri = { version = "2", features = ["macos-private-api"] }
uniffi = "0.28"
uniffi_build = "0.28"
cbindgen = "0.26"

[package]
name = "flare-im-core-sdk"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Flare Team"]
license = "MIT"
description = "Flare IM Client SDK - Event-stream driven cross-platform IM client library"

[lib]
name = "flare_im_core_sdk"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
integration-tests = []

[dependencies]
flare-core = { workspace = true }
flare-proto = { workspace = true }

serde = { workspace = true }
serde_json = "1.0"
anyhow = { workspace = true }
thiserror = "2.0"
async-trait = "0.1"
prost = "0.14"
prost-types = { workspace = true }
tracing = "0.1"
flate2 = "1.0"
jsonwebtoken = "9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "sync", "rt", "time"] }

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
once_cell = "1"
